<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Masuk - Smart Expiry</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ESE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=asset_v) }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-logo" aria-hidden="true">SE</div>
    <h1>Smart Expiry</h1>
    <p class="muted">Pantau stok dan tanggal kedaluwarsa barang di toko</p>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <div class="password-row">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="togglePw" class="link-btn" aria-label="Tampilkan atau sembunyikan password">Lihat</button>
      </div>

      <p id="loginError" class="error" role="alert" hidden></p>
      <button type="submit" id="loginBtn" class="primary-btn">Masuk</button>
      <p class="hint">Belum punya akun? Minta dibuatkan oleh Admin.</p>
    </form>
  </main>
  <script src="{{ url_for('static', filename='js/login.js', v=asset_v) }}"></script>
</body>
</html>
